<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Trace Playground</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="toolbar" aria-label="Text trace controls">
        <label>
          <span>Text</span>
          <input id="text-input" value="Hello, world!" maxlength="80" />
        </label>
        <label>
          <span>Font</span>
          <select id="font-select">
            <option value="noto-sc" selected>Noto Sans SC</option>
            <option value="noto-jp">Noto Sans JP</option>
            <option value="inter">Inter</option>
            <option value="garamond">EB Garamond</option>
          </select>
        </label>
        <label>
          <span>Drama</span>
          <select id="drama-select">
            <option value="none">No pause</option>
            <option value="subtle" selected>Subtle</option>
            <option value="dramatic">Dramatic</option>
            <option value="cinematic">Cinematic</option>
          </select>
        </label>
        <label>
          <span>Horizontal delay</span>
          <input id="horizontal-delay-input" type="number" min="0" step="50" value="0" />
        </label>
        <label>
          <span>Guide delay</span>
          <input id="guide-delay-input" type="number" min="0" step="50" value="100" />
        </label>
        <label>
          <span>Stroke delay</span>
          <input id="stroke-delay-input" type="number" min="0" step="50" value="400" />
        </label>
        <label>
          <span>Fill delay</span>
          <input id="fill-delay-input" type="number" min="0" step="50" value="800" />
        </label>
        <label>
          <span>Erase delay</span>
          <input id="erase-delay-input" type="number" min="0" step="50" value="1000" />
        </label>
        <label>
          <span>Vertical overshoot</span>
          <input id="vertical-overshoot-input" type="number" min="0" step="2" value="28" />
        </label>
        <label>
          <span>Vertical probability</span>
          <input id="vertical-probability-input" type="number" min="0" max="1" step="0.05" value="0.45" />
        </label>
        <label class="checkbox-label">
          <input id="merge-overlaps-input" type="checkbox" />
          <span>Merge overlaps</span>
        </label>
        <button id="replay-button" type="button">Replay</button>
      </section>

      <section class="preview-panel" aria-label="Text trace preview">
        <header>
          <h1>Core Playground</h1>
          <p id="phase-readout">Idle</p>
        </header>
        <div class="stage">
          <svg id="trace-stage" class="trace-svg"></svg>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
