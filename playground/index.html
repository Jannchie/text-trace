<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Trace Playground</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <h1>Text Trace</h1>
          <p>Playground for <code>@text-trace/core</code></p>
        </div>
        <div class="header-actions">
          <span class="phase">
            <span id="phase-readout">Idle</span>
          </span>
          <button id="replay-button" type="button">Replay</button>
        </div>
      </header>

      <div class="app-body">
        <aside class="controls" aria-label="Text trace controls">
          <fieldset>
            <legend>Content</legend>
            <label class="wide">
              <span>Text</span>
              <input id="text-input" value="Hello, world!" maxlength="80" autocomplete="off" spellcheck="false" />
            </label>
            <label>
              <span>Font</span>
              <select id="font-select">
                <option value="noto-sc" selected>Noto Sans SC</option>
                <option value="noto-jp">Noto Sans JP</option>
                <option value="inter">Inter</option>
                <option value="garamond">EB Garamond</option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend>Style</legend>
            <label>
              <span>Text color</span>
              <input id="text-color-input" type="color" value="#111827" />
            </label>
            <label>
              <span>Guide color</span>
              <input id="guide-color-input" type="color" value="#111827" />
            </label>
          </fieldset>

          <fieldset>
            <legend>Timing</legend>
            <label>
              <span>Duration</span>
              <input id="duration-input" type="number" min="0" step="100" value="1000" />
            </label>
            <label>
              <span>Horizontal</span>
              <input id="horizontal-time-input" type="number" min="0" max="1" step="0.01" value="0" />
            </label>
            <label>
              <span>Guide</span>
              <input id="guide-time-input" type="number" min="0" max="1" step="0.01" value="0.1" />
            </label>
            <label>
              <span>Stroke</span>
              <input id="stroke-time-input" type="number" min="0" max="1" step="0.01" value="0.4" />
            </label>
            <label>
              <span>Fill</span>
              <input id="fill-time-input" type="number" min="0" max="1" step="0.01" value="0.8" />
            </label>
            <label>
              <span>Erase</span>
              <input id="erase-time-input" type="number" min="0" max="1" step="0.01" value="1" />
            </label>
          </fieldset>

          <fieldset>
            <legend>Guides</legend>
            <label>
              <span>Vertical overshoot</span>
              <input id="vertical-overshoot-input" type="number" min="0" step="2" value="28" />
            </label>
            <label>
              <span>Vertical probability</span>
              <input id="vertical-probability-input" type="number" min="0" max="1" step="0.05" value="0.45" />
            </label>
            <label class="checkbox">
              <input id="merge-overlaps-input" type="checkbox" />
              <span>Merge overlapping shapes</span>
            </label>
          </fieldset>
        </aside>

        <section class="content">
          <div class="stage" aria-label="Text trace preview">
            <svg id="trace-stage" class="trace-svg" aria-label="Hello, world!"></svg>
          </div>

          <div class="usage">
            <div class="usage-tabs" role="tablist">
              <button type="button" role="tab" data-tab="ts" aria-selected="true">TypeScript</button>
              <button type="button" role="tab" data-tab="vue" aria-selected="false">Vue</button>
              <button type="button" role="tab" data-tab="react" aria-selected="false">React</button>
              <button type="button" id="copy-button" class="copy" aria-label="Copy snippet">Copy</button>
            </div>
            <div class="usage-code" data-tab="ts" data-active="true" id="snippet-ts"></div>
            <div class="usage-code" data-tab="vue" id="snippet-vue"></div>
            <div class="usage-code" data-tab="react" id="snippet-react"></div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
